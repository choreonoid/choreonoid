name: build test

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:

# Stop the running workflow of a branch when a new commit is pushed to it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The install scripts pass these variables to apt-get with the sudo
# --preserve-env option so that no installation step asks anything interactively
env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Asia/Tokyo

jobs:
  build:
    name: build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.ubuntu }}
    # The runner image of Ubuntu 26.04 is still a preview version and it can fail
    # for reasons that have nothing to do with Choreonoid. Such a failure is
    # reported but it does not make the whole workflow fail.
    continue-on-error: ${{ matrix.ubuntu == 'ubuntu-26.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update the package lists
        run: sudo apt-get update

      # Some runner images lack a package that the ordinary install script
      # assumes to be present. The additional script exists only for them.
      - name: Install the dependencies only necessary on the GitHub Actions runner
        run: |
          script=.github/script/install-requisites-${{ matrix.ubuntu }}-for-github-actions.sh
          if [ -f "$script" ]; then sh "$script"; fi

      - name: Install the dependencies of Choreonoid
        run: sh misc/script/install-requisites-${{ matrix.ubuntu }}.sh

      - name: Build Choreonoid
        run: |
          cmake -S . -B build
          cmake --build build --parallel $(nproc)

      # Installing Choreonoid detects a missing or wrong install rule, which the
      # build alone cannot detect
      - name: Install Choreonoid
        run: |
          sudo cmake --install build
          sudo ldconfig

      # The batch mode makes Choreonoid exit as soon as all the automatic
      # processing has finished, and its return code becomes non-zero if any
      # error message has been output. This detects a failure in the start-up
      # process, which the build and the installation cannot detect. No window
      # system is available on the runner, so Choreonoid runs in the no-window
      # mode. The timeout is a safeguard against an unexpected hang.
      - name: Check that the installed Choreonoid starts up
        run: timeout 60 choreonoid --batch
